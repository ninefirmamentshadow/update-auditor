name: build

# CI runs the same script a developer or agent runs locally (scripts/verify.sh), so
# "green" means the same thing everywhere. Debug is the fresh-clone floor and always
# builds. The signed release APK builds only once the repo has the
# ANDROID_KEYSTORE_BASE64 secret, and its absence breaks nothing. scripts/release.sh
# refuses debuggable or unsigned output, so a debug build can never be published as
# the operational release.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # secrets.* is disallowed inside `if:` conditionals (parse-time restriction).
    # Compute it into a job env var and branch on that instead.
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The release changelog reads tags and history.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Uses the committed wrapper (Gradle 8.9, checksum-pinned); no gradle-version here.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK pieces
        run: |
          if [ ! -d "${ANDROID_HOME:-/nonexistent}/build-tools/35.0.0" ] || [ ! -d "${ANDROID_HOME:-/nonexistent}/platforms/android-35" ]; then
            scripts/bootstrap-android-sdk.sh
          fi

      - name: Verify (tests, screenshots, lint, debug build, inventory, whitespace)
        env:
          VERIFY_GRADLE_ARGS: --stacktrace
          VERIFY_RETRIES: '2'
        run: scripts/verify.sh

      - name: Write debug provenance
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          manifest="app/build/outputs/apk/debug/build-info.txt"
          version="$(./gradlew -q --no-daemon printVersion)"
          version_name="$(printf '%s\n' "$version" | sed -n 's/^versionName=//p')"
          version_code="$(printf '%s\n' "$version" | sed -n 's/^versionCode=//p')"
          test -n "$version_name" && test -n "$version_code"
          {
            echo "artifact=update-auditor-debug"
            echo "commit=$GITHUB_SHA"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "apk_sha256=$(sha256sum "$apk" | cut -d ' ' -f 1)"
          } > "$manifest"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: update-auditor-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error

      # Release signing only runs once the repo has the secrets set. The keystore
      # and passwords reach the build through environment variables only; nothing
      # secret is interpolated into script text.
      - name: Decode release keystore
        if: ${{ github.event_name != 'pull_request' && env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build and inspect release APK
        if: ${{ github.event_name != 'pull_request' && env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERIFY_GRADLE_ARGS: --stacktrace
        # verify.sh already passed above at this commit. The script reads the signer
        # certificate digest from the APK itself (apksigner), refuses a debuggable
        # or unsigned APK, and writes release/release-manifest.json.
        run: scripts/release.sh --skip-verify

      - name: Upload release APK
        if: ${{ github.event_name != 'pull_request' && env.HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: update-auditor-release
          path: |
            release/update-auditor-*.apk
            release/release-manifest.json
            release/changelog.md
          retention-days: 90
          if-no-files-found: error

      - name: Remove release keystore
        if: ${{ always() && github.event_name != 'pull_request' && env.HAS_RELEASE_SIGNING == 'true' }}
        run: rm -f "$RUNNER_TEMP/release.jks"
